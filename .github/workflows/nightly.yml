# CHG-PW-008: nightly build, gated publish and live check for politicianwatch.grokforum.site.
#
# PUBLISH GATE (owner's GO required): the publish job runs only when ALL of these hold:
#   1. the run is on main (this file only takes effect once merged with the owner's GO);
#   2. the repository variable PW_PUBLISH_ENABLED is exactly 'true' (unset by default);
#   3. the job runs in the GitHub Environment "site-publish" (owner creates it after the GO:
#      deployment branches limited to main, required reviewer = owner where the plan allows),
#      and the secret PW_SITE_DEPLOY_KEY (a write deploy key on GrokForum/politicianwatch-site)
#      is stored in that environment. Neither exists yet. If the flag is on and the key is
#      missing, the job fails closed and the night is red. See CHG-PW-008 for plan limits.
# Until the owner GOes and the flag and key are set, the nightly builds, tests and checks,
# runs the live check against whatever is live, and records the result, but publishes nothing.
#
# Evidence per night: artifact "nightly-<run id>" (90 days) and one line appended to
# nightly/log.jsonl on the branch "nightly-log" of this private repo (never main), pushed by the
# separate "record" job, the only job with contents: write.
name: nightly

on:
  schedule:
    - cron: "30 1 * * *"   # 03:30 SAST (UTC+2)
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command in a pipe fails the step

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  PW_SITE_URL: https://politicianwatch.grokforum.site
  UV_VERSION: "0.13.8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_id: ${{ steps.site.outputs.build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # CHG-PW-009: the build never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}" && uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: DQ gate (exit 2 = not releasable)
        run: |
          mkdir -p evidence
          uv run pwatch dq > evidence/dq.json
      - name: Renders current
        run: uv run pwatch render --check
      - name: Build site
        id: site
        run: |
          uv run pwatch site build --out _site --commit "$GITHUB_SHA" > evidence/site-build.json
          echo "build_id=$(python -c 'import json;print(json.load(open("_site/manifest.json"))["build_id"])')" >> "$GITHUB_OUTPUT"
      - name: Site check (noindex, DRAFT, privacy, every claim labelled with a dated source link)
        run: uv run pwatch site check _site | tee evidence/site-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: _site
          include-hidden-files: false
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-evidence
          path: evidence
          retention-days: 90

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' && vars.PW_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-publish
    steps:
      - name: Require the deploy key (fail closed)
        env:
          KEY: ${{ secrets.PW_SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::PW_SITE_DEPLOY_KEY is not set; nothing published"; exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: _site
      # The deploy key MUST stay persisted: the push below authenticates with it. This job
      # uploads no artifacts, so zizmor's artipacked risk does not apply (CHG-PW-009).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          repository: GrokForum/politicianwatch-site
          ref: main
          ssh-key: ${{ secrets.PW_SITE_DEPLOY_KEY }}
          path: site-repo
      - name: Copy the build over the site repo (CNAME and README kept) and push
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -eu
          rsync -a --delete --exclude .git --exclude CNAME --exclude README.md _site/ site-repo/
          cd site-repo
          git config user.name "PoliticianWatch publisher"
          git config user.email "noreply@politicianwatch.grokforum.site"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Nightly publish ${BUILD_ID} from politicianwatch-sa@${GITHUB_SHA}"
          git push origin HEAD:main

  live-check:
    needs: [build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}" && uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: build-evidence
          path: evidence
      - name: Live check
        id: live
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p nightly
          uv run pwatch live-check --url "$PW_SITE_URL" \
            --expect-manifest _site/manifest.json --dq evidence/dq.json \
            --build-result "${{ needs.build.result }}" \
            --publish-result "${{ needs.publish.result }}" \
            --publish-enabled "${{ vars.PW_PUBLISH_ENABLED == 'true' }}" \
            --wait-seconds 900 --run-url "$RUN_URL" \
            --out nightly/result.json
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("nightly/result.json"))
          print(f"## Nightly {r['night_sast']}: **{r['result'].upper()}**\n")
          print(f"build {r['build']['result']} ({r['build']['build_id']}), dq {r['dq']['status']}, publish {r['publish']['result']} (enabled: {r['publish']['enabled']})\n")
          for c in r["live"]["checks"]:
              print(f"- {'PASS' if c['ok'] else 'FAIL'} {c['name']} {c['detail']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-${{ github.run_id }}
          path: nightly/result.json
          retention-days: 90
      - name: Night verdict
        run: test "${{ steps.live.outcome }}" = success

  record:
    # The only job that can write: it appends tonight's record to the nightly-log branch.
    # CHG-PW-009: only runs on main (scheduled runs are on main; a manual run from another
    # branch is not recorded).
    needs: live-check
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-${{ github.run_id }}
          path: nightly
      - name: Append the record to the nightly-log branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/record-nightly.sh nightly/result.json
