[project]
name = "pwatch"
version = "0.1.0"
description = "PoliticianWatch SA: a neutral, sourced public register of South African elected representatives"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.4.1",
  "httpx==0.28.1",
  "pdfplumber==0.11.7",
  "pyyaml==6.0.3",
  "pytz==2025.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
pwatch = "pwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
